<!DOCTYPE html>
<html lang="tr">
<head>

        .btn-link:hover { background-color: #1d4ed8; transform: translateY(-1px); }
        .btn-secondary { background-color: #6d28d9; box-shadow: 0 4px 12px rgba(109, 40, 217, 0.15); }
